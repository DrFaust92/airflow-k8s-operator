apiVersion: v1
kind: Secret
metadata:
  name: example-user-password
  # namespace: default
stringData:
  password: "change-me-0perator"
---
apiVersion: airflow.drfaust92/v1beta1
kind: AirflowUser
metadata:
  name: example-user
  # namespace: default
spec:
  email: example-user@example.com
  firstName: Example
  lastName: User
  roles:
    - Example Role
  passwordSecretRef:
    name: example-user-password
    key: password
