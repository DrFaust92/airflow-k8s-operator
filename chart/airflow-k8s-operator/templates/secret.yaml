{{- if and .Values.operator.basicAuthSecret.enabled .Values.operator.basicAuthSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.operator.basicAuthSecret.secretName }}
type: Opaque
data:
  {{ .Values.operator.basicAuthSecret.usernameKey }}: {{ required "operator.basicAuthSecret.username is required when basicAuthSecret.create is true" .Values.operator.basicAuthSecret.username | b64enc }}
  {{ .Values.operator.basicAuthSecret.passwordKey }}: {{ required "operator.basicAuthSecret.password is required when basicAuthSecret.create is true" .Values.operator.basicAuthSecret.password | b64enc }}
{{- end }}
