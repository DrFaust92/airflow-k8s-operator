name: image-build

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - main.py
      - "resources/**"
      - .github/workflows/image-build.yaml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: airflow-k8s-operator:ci

      - name: Smoke test
        run: |
          docker run --rm --entrypoint kopf airflow-k8s-operator:ci --version
          docker run --rm -e AIRFLOW_HOST=http://localhost:8080 -e AIRFLOW_USERNAME=smoke -e AIRFLOW_PASSWORD=smoke --entrypoint python airflow-k8s-operator:ci -c "import main"
          test "$(docker run --rm --entrypoint id airflow-k8s-operator:ci -u)" = "999"
