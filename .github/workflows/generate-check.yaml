name: generate-check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  crds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        # uses .python-version file by default
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Regenerate CRDs from the spec models
        run: uv run python scripts/gen_crds.py

      - name: Fail if the committed CRDs are stale
        run: |
          git diff --exit-code -- chart/airflow-k8s-operator-crds/templates \
            || (echo "::error::CRDs are out of date. Run 'make generate' and commit." && exit 1)
