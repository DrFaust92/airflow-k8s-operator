name: unit-test

on: pull_request

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        # uses .python-version file by default
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Run unit tests
        # Exclude the integration tests, which require a Kind cluster + Airflow.
        run: >-
          uv run pytest tests/
          --ignore=tests/operator_test.py
          --ignore=tests/variable_test.py
          --ignore=tests/giveup_test.py
          -v
