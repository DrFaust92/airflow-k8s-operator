name: Lint Charts

on:
  pull_request:
    paths:
      - 'chart/**'
      - '.github/workflows/helm-ci.yaml'
      - '.trivyignore'

permissions:
  contents: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Lint CRD chart
        # Excluded from ct (see config.yaml), so lint it explicitly.
        run: helm lint chart/airflow-k8s-operator-crds

      - name: Build operator chart dependencies
        run: helm dependency build chart/airflow-k8s-operator

      - name: Render both scopes
        run: |
          set -euo pipefail
          CHART=chart/airflow-k8s-operator
          echo "== scope=cluster =="
          helm template t "$CHART" --set operator.airflowHost=airflow.example.com --set scope=cluster > /dev/null
          echo "== scope=namespaced =="
          helm template t "$CHART" --set operator.airflowHost=airflow.example.com --set scope=namespaced > /dev/null
          echo "== scope=namespaced, crds.create=false (tenant release) =="
          helm template t "$CHART" --set operator.airflowHost=airflow.example.com --set scope=namespaced --set crds.create=false > /dev/null
          echo "== standalone CRD chart =="
          helm template t chart/airflow-k8s-operator-crds > /dev/null

      - name: Run chart-testing (list-changed)
        id: list-changed
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          changed=$(ct list-changed --config config.yaml --target-branch "$TARGET_BRANCH")
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --config config.yaml --target-branch "$TARGET_BRANCH"

      - name: Build Docker image
        if: steps.list-changed.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64
          context: .
          tags: "airflow-k8s-operator:ci-test"
          load: true

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kind-chart-testing
      - name: Load Docker image into kind
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          kind load docker-image airflow-k8s-operator:ci-test --name kind-chart-testing

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct install --config config.yaml --target-branch "$TARGET_BRANCH"

  trivy:
    # Kept apart from helm-lint so the scanner runs with no secrets, a read-only
    # token and no cache. See CVE-2026-33634: pin by SHA, never by tag.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Render both scopes
        run: |
          set -euo pipefail
          CHART=chart/airflow-k8s-operator
          helm dependency build "$CHART"
          mkdir rendered-chart
          for scope in cluster namespaced; do
            helm template t "$CHART" --set operator.airflowHost=airflow.example.com \
              --set scope="$scope" > "rendered-chart/$scope.yaml"
          done

      - name: Scan rendered manifests
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: rendered-chart
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          version: v0.76.2
          cache: "false"
